<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vape Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0F19;
    --panel: #121826;
    --panel-2: #182034;
    --line: rgba(255,255,255,0.08);
    --text: #E8ECF4;
    --muted: #8992A9;
    --cyan: #4CE0D2;
    --violet: #9B7EF2;
    --amber: #F2A65A;
    --pink: #FF6FA5;
    --brown: #C08552;
    --grey: #8992A9;
    --red: #F26D6D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 800px 500px at 15% -10%, rgba(76,224,210,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(155,126,242,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}

  /* Header */
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:26px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);}
  .brand h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;margin:0;letter-spacing:-0.01em;}
  .brand h1 span{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;}

  .toggle{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;}
  .toggle button{
    border:none;background:transparent;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;
    padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .25s ease;
  }
  .toggle button.active{background:linear-gradient(90deg,var(--cyan),var(--violet));color:#0B0F19;}
  .toggle button:not(.active):hover{color:var(--text);}
  .public-menu .toggle{display:none;}

  /* Cards / panels */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;}
  .view{display:none;}
  .view.active{display:block;}

  /* Hero mist strip */
  .mist-strip{position:relative;height:80px;border-radius:18px;overflow:hidden;margin-bottom:22px;border:1px solid var(--line);
    background:linear-gradient(120deg, rgba(76,224,210,0.10), rgba(155,126,242,0.10));}
  .mist-strip::before, .mist-strip::after{content:"";position:absolute;inset:-40%;
    background:
      radial-gradient(circle at 20% 40%, rgba(255,255,255,.10), transparent 40%),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.08), transparent 45%),
      radial-gradient(circle at 45% 20%, rgba(255,255,255,.07), transparent 40%);
    filter:blur(10px);animation:drift 14s ease-in-out infinite;
  }
  .mist-strip::after{animation-duration:20s;animation-direction:reverse;opacity:.6;}
  @keyframes drift{
    0%{background-position:0% 0%,100% 100%,50% 50%;}
    50%{background-position:60% 40%,20% 60%,80% 20%;}
    100%{background-position:0% 0%,100% 100%,50% 50%;}
  }
  .mist-strip .msg{position:relative;z-index:1;height:100%;display:flex;align-items:center;padding:0 22px;font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--text);}
  .mist-strip .msg b{color:var(--cyan);margin-right:6px;}

  /* Flavor grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .flavor-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden;transition:transform .2s ease, border-color .2s ease;}
  .flavor-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,0.18);}
  .flavor-card .cat-tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;margin-bottom:10px;}
  .flavor-card h3{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0 0 4px;}
  .flavor-card .price{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:13px;margin-bottom:12px;}
  .badges{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .badge{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;}
  .badge.best{background:rgba(242,166,90,0.15);color:var(--amber);border:1px solid rgba(242,166,90,0.35);}
  .badge.low{background:rgba(255,111,165,0.15);color:var(--pink);border:1px solid rgba(255,111,165,0.35);}
  .badge.out{background:rgba(242,109,109,0.15);color:var(--red);border:1px solid rgba(242,109,109,0.35);}

  .vapor-gauge{position:relative;width:100%;height:34px;border-radius:12px;background:rgba(255,255,255,0.03);overflow:hidden;border:1px solid var(--line);}
  .vapor-fill{position:absolute;left:0;right:0;bottom:0;transition:height .6s ease;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.55), transparent 42%),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.35), transparent 45%),
      radial-gradient(circle at 45% 80%, rgba(255,255,255,.4), transparent 40%);
    background-size:220% 220%;
    animation:drift 7s ease-in-out infinite;
    filter:blur(4px);
  }
  .gauge-label{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text);text-shadow:0 1px 3px rgba(0,0,0,0.4);}

  /* Manage view */
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:22px;}
  .dash-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .dash-card .label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .dash-card .big{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;}
  .mini-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .mini-list li{display:flex;justify-content:space-between;font-size:13px;}
  .mini-list li .n{color:var(--text);}
  .mini-list li .v{font-family:'JetBrains Mono',monospace;color:var(--muted);}
  .mini-list.empty{color:var(--muted);font-size:13px;font-style:italic;}

  .section-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
  .section-title .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:0 10px 10px;}
  td{padding:10px;border-top:1px solid var(--line);vertical-align:middle;}
  tr.row-low td{background:rgba(242,166,90,0.05);}
  tr.row-out td{background:rgba(242,109,109,0.05);}
  input, select{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;font-family:'Inter',sans-serif;font-size:13px;width:100%;
  }
  input[type=number]{font-family:'JetBrains Mono',monospace;}
  .num-col{width:80px;}
  .name-col{min-width:150px;}
  .cat-col{width:120px;}
  .price-col{width:90px;}
  .actions-col{width:104px;}
  .row-actions{display:flex;align-items:center;gap:8px;}
  .save-btn{background:rgba(76,224,210,0.12);border:1px solid rgba(76,224,210,0.35);color:var(--cyan);font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;padding:7px 10px;border-radius:7px;cursor:pointer;transition:background .2s,color .2s;}
  .save-btn:hover{background:var(--cyan);color:#0B0F19;}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px;line-height:1;transition:color .2s;}
  .icon-btn:hover{color:var(--red);}

  .add-form{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:end;}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:110px;}
  .field label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .btn-primary{background:linear-gradient(90deg,var(--cyan),var(--violet));border:none;color:#0B0F19;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;padding:9px 18px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:opacity .2s;}
  .btn-primary:hover{opacity:.85;}

  .settings-row{display:flex;gap:24px;flex-wrap:wrap;margin-top:14px;}
  .settings-row .field{max-width:220px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state .glyph{font-size:34px;margin-bottom:10px;opacity:.6;}

  footer{text-align:center;margin-top:36px;font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;}

  @media (max-width:600px){
    .brand h1{font-size:24px;}
    header{flex-direction:column;}
    .toggle{align-self:flex-start;}
  }
</style>
</head>
<body class="public-menu">
<div class="wrap">

  <header>
    <div class="brand">
      <span class="eyebrow">Flavor Menu &amp; Inventory</span>
      <h1 id="shopTitle">Cloud<span>Nine</span> Vapor</h1>
    </div>
    <div class="toggle">
      <button id="tabShopBtn" class="active">Shop</button>
      <button id="tabManageBtn">Manage</button>
    </div>
  </header>

  <!-- SHOP VIEW -->
  <div class="view active" id="viewShop">
    <div class="mist-strip">
      <div class="msg"><b>●</b><span id="shopSubline">Loading current flavors…</span></div>
    </div>
    <div id="shopGrid" class="grid"></div>
  </div>

  <!-- MANAGE VIEW -->
  <div class="view" id="viewManage">

    <div class="section-title"><span class="dot"></span>Overview</div>
    <div class="dash-grid">
      <div class="dash-card">
        <div class="label">Best Sellers</div>
        <ul class="mini-list" id="bestSellerList"></ul>
      </div>
      <div class="dash-card">
        <div class="label">Low Stock Alerts</div>
        <ul class="mini-list" id="lowStockList"></ul>
      </div>
      <div class="dash-card">
        <div class="label">Total Flavors</div>
        <div class="big" id="totalFlavors">0</div>
      </div>
      <div class="dash-card">
        <div class="label">Units In Stock</div>
        <div class="big" id="totalUnits">0</div>
      </div>
    </div>

    <div class="section-title"><span class="dot"></span>Inventory</div>
    <div class="panel">
      <table>
        <thead>
          <tr>
            <th class="name-col">Flavor</th>
            <th class="cat-col">Category</th>
            <th class="price-col">Price</th>
            <th class="num-col">Stock</th>
            <th class="num-col">Sold</th>
            <th class="actions-col"></th>
          </tr>
        </thead>
        <tbody id="inventoryBody"></tbody>
      </table>

      <div class="add-form">
        <div class="field" style="flex:2;min-width:160px;">
          <label>New flavor name</label>
          <input type="text" id="newName" placeholder="e.g. Blue Razz Ice">
        </div>
        <div class="field">
          <label>Category</label>
          <select id="newCategory">
            <option>Fruity</option>
            <option>Menthol</option>
            <option>Dessert</option>
            <option>Tobacco</option>
            <option>Beverage</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field" style="max-width:90px;">
          <label>Price</label>
          <input type="number" id="newPrice" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="field" style="max-width:90px;">
          <label>Stock</label>
          <input type="number" id="newStock" min="0" step="1" placeholder="0">
        </div>
        <button class="btn-primary" id="addBtn">+ Add Flavor</button>
      </div>
    </div>

    <div class="section-title"><span class="dot"></span>Settings</div>
    <div class="panel">
      <div class="settings-row">
        <div class="field">
          <label>Ralph Vape Menu</label>
          <input type="text" id="settingShopName" placeholder="Your Shop Name">
        </div>
        <div class="field">
          <label>Low stock threshold (units)</label>
          <input type="number" id="settingThreshold" min="0" step="1">
        </div>
      </div>
    </div>
  </div>

  <footer>changes save automatically &middot; saved in this browser</footer>
</div>

<script>
const CATEGORY_COLORS = {
  Fruity: 'var(--pink)',
  Menthol: 'var(--cyan)',
  Dessert: 'var(--amber)',
  Tobacco: 'var(--brown)',
  Beverage: 'var(--violet)',
  Other: 'var(--grey)'
};

let products = [];
let settings = { shopName: 'Ralph Vape', lowStockThreshold: 10 };
let saveTimer = null;

const seedProducts = () => ([
  { id: cryptoId(), name: 'Blue Razz Ice', category: 'Fruity', price: 14.99, stock: 42, sold: 118 },
  { id: cryptoId(), name: 'Mint Frost', category: 'Menthol', price: 13.99, stock: 6, sold: 95 },
  { id: cryptoId(), name: 'Vanilla Custard', category: 'Dessert', price: 15.99, stock: 30, sold: 40 },
  { id: cryptoId(), name: 'Classic Tobacco', category: 'Tobacco', price: 12.99, stock: 0, sold: 22 },
  { id: cryptoId(), name: 'Peach Mango', category: 'Fruity', price: 14.99, stock: 55, sold: 70 },
  { id: cryptoId(), name: 'Cola Rush', category: 'Beverage', price: 13.49, stock: 8, sold: 33 },
]);

function cryptoId(){ return 'p_' + Math.random().toString(36).slice(2,10); }

async function loadData(){
  try{
    const savedProducts = localStorage.getItem('vape-shop-products');
    products = savedProducts ? JSON.parse(savedProducts) : seedProducts();
  }catch(e){
    products = seedProducts();
  }
  try{
    const savedSettings = localStorage.getItem('vape-shop-settings');
    if(savedSettings) settings = { ...settings, ...JSON.parse(savedSettings) };
  }catch(e){ /* use defaults */ }

  if(!localStorage.getItem('vape-shop-products')) await saveProducts();
  renderAll();
}

async function saveProducts(){
  try{
    localStorage.setItem('vape-shop-products', JSON.stringify(products));
  }catch(e){ console.error('Could not save products', e); }
}
async function saveSettings(){
  try{
    localStorage.setItem('vape-shop-settings', JSON.stringify(settings));
  }catch(e){ console.error('Could not save settings', e); }
}

function queueSaveProducts(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProducts, 300);
}

/* ---------- Derived data ---------- */
function bestSellers(){
  return [...products].filter(p=>p.sold>0).sort((a,b)=>b.sold-a.sold).slice(0,3);
}
function lowStock(){
  return products.filter(p=>p.stock>0 && p.stock<=settings.lowStockThreshold).sort((a,b)=>a.stock-b.stock);
}
function outOfStock(){
  return products.filter(p=>p.stock===0);
}
function stockPct(p){
  const maxRef = Math.max(50, ...products.map(x=>x.stock), 1);
  return Math.max(0, Math.min(100, Math.round((p.stock/maxRef)*100)));
}
function stockLabel(p){
  if(p.stock===0) return 'Sold Out';
  if(p.stock<=settings.lowStockThreshold) return 'Limited';
  return 'In Stock';
}

/* ---------- Rendering ---------- */
function renderAll(){
  document.getElementById('shopTitle').innerHTML = escapeHtml(settings.shopName).replace(/(\S+)$/, '<span>$1</span>');
  document.getElementById('settingShopName').value = settings.shopName;
  document.getElementById('settingThreshold').value = settings.lowStockThreshold;
  renderShop();
  renderManage();
}

function renderShop(){
  const grid = document.getElementById('shopGrid');
  const sub = document.getElementById('shopSubline');
  const bs = bestSellers().map(p=>p.id);
  const available = products.length;
  sub.textContent = available ? `${available} flavors on the menu right now` : 'No flavors listed yet';

  if(!products.length){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="glyph">☁</div>No flavors available yet — check back soon.</div>`;
    return;
  }

  grid.innerHTML = products.map(p=>{
    const pct = stockPct(p);
    const label = stockLabel(p);
    const isBest = bs.includes(p.id);
    const isOut = p.stock===0;
    const isLow = !isOut && p.stock<=settings.lowStockThreshold;
    const color = CATEGORY_COLORS[p.category] || 'var(--grey)';
    return `
      <div class="flavor-card">
        <div class="badges">
          ${isBest ? '<span class="badge best">🔥 Best Seller</span>' : ''}
          ${isOut ? '<span class="badge out">Sold Out</span>' : (isLow ? '<span class="badge low">Limited</span>' : '')}
        </div>
        <span class="cat-tag" style="background:color-mix(in srgb, ${color} 18%, transparent); color:${color}; border:1px solid color-mix(in srgb, ${color} 40%, transparent);">${p.category}</span>
        <h3>${escapeHtml(p.name)}</h3>
        <div class="price">₱${Number(p.price).toFixed(2)}</div>
        <div class="vapor-gauge">
          <div class="vapor-fill" style="height:${isOut ? 0 : Math.max(pct,14)}%; background-color:color-mix(in srgb, ${color} 55%, transparent);"></div>
          <div class="gauge-label">${label}</div>
        </div>
      </div>`;
  }).join('');
}

function renderManage(){
  // dashboard
  const bsList = document.getElementById('bestSellerList');
  const bs = bestSellers();
  bsList.className = bs.length ? 'mini-list' : 'mini-list empty';
  bsList.innerHTML = bs.length
    ? bs.map(p=>`<li><span class="n">${escapeHtml(p.name)}</span><span class="v">${p.sold} sold</span></li>`).join('')
    : 'No sales recorded yet';

  const lowList = document.getElementById('lowStockList');
  const low = [...lowStock(), ...outOfStock()];
  lowList.className = low.length ? 'mini-list' : 'mini-list empty';
  lowList.innerHTML = low.length
    ? low.map(p=>`<li><span class="n">${escapeHtml(p.name)}</span><span class="v">${p.stock===0?'0 (out)':p.stock+' left'}</span></li>`).join('')
    : 'Everything is well stocked';

  document.getElementById('totalFlavors').textContent = products.length;
  document.getElementById('totalUnits').textContent = products.reduce((s,p)=>s+Number(p.stock||0),0);

  // table
  const body = document.getElementById('inventoryBody');
  if(!products.length){
    body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px;">No flavors yet — add your first one below.</td></tr>`;
    return;
  }
  body.innerHTML = products.map(p=>{
    const rowClass = p.stock===0 ? 'row-out' : (p.stock<=settings.lowStockThreshold ? 'row-low' : '');
    return `
    <tr class="${rowClass}" data-id="${p.id}">
      <td><input type="text" class="edit-name" value="${escapeAttr(p.name)}"></td>
      <td>
        <select class="edit-category">
          ${Object.keys(CATEGORY_COLORS).map(c=>`<option value="${c}" ${c===p.category?'selected':''}>${c}</option>`).join('')}
        </select>
      </td>
      <td><input type="number" min="0" step="0.01" class="edit-price" value="${p.price}"></td>
      <td><input type="number" min="0" step="1" class="edit-stock" value="${p.stock}"></td>
      <td><input type="number" min="0" step="1" class="edit-sold" value="${p.sold}"></td>
      <td><div class="row-actions"><button class="save-btn save-row" type="button">Save</button><button class="icon-btn del-btn" type="button" title="Delete">✕</button></div></td>
    </tr>`;
  }).join('');
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ---------- Events ---------- */
document.getElementById('tabShopBtn').addEventListener('click', ()=>{
  document.getElementById('tabShopBtn').classList.add('active');
  document.getElementById('tabManageBtn').classList.remove('active');
  document.getElementById('viewShop').classList.add('active');
  document.getElementById('viewManage').classList.remove('active');
});
document.getElementById('tabManageBtn').addEventListener('click', ()=>{
  document.getElementById('tabManageBtn').classList.add('active');
  document.getElementById('tabShopBtn').classList.remove('active');
  document.getElementById('viewManage').classList.add('active');
  document.getElementById('viewShop').classList.remove('active');
});

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('newName').value.trim();
  const category = document.getElementById('newCategory').value;
  const price = parseFloat(document.getElementById('newPrice').value) || 0;
  const stock = parseInt(document.getElementById('newStock').value) || 0;
  if(!name) return;
  products.push({ id: cryptoId(), name, category, price, stock, sold: 0 });
  document.getElementById('newName').value = '';
  document.getElementById('newPrice').value = '';
  document.getElementById('newStock').value = '';
  await saveProducts();
  renderAll();
});

document.getElementById('inventoryBody').addEventListener('input', (e)=>{
  const row = e.target.closest('tr');
  if(!row) return;
  const id = row.dataset.id;
  const p = products.find(x=>x.id===id);
  if(!p) return;
  if(e.target.classList.contains('edit-name')) p.name = e.target.value;
  if(e.target.classList.contains('edit-category')) p.category = e.target.value;
  if(e.target.classList.contains('edit-price')) p.price = parseFloat(e.target.value) || 0;
  if(e.target.classList.contains('edit-stock')) p.stock = Math.max(0, parseInt(e.target.value) || 0);
  if(e.target.classList.contains('edit-sold')) p.sold = Math.max(0, parseInt(e.target.value) || 0);
  queueSaveProducts();
  // live-update dashboard + shop without rebuilding the input the user is typing in
  renderDashboardOnly();
});

document.getElementById('inventoryBody').addEventListener('change', ()=>{
  renderAll();
});

document.getElementById('inventoryBody').addEventListener('click', async (e)=>{
  if(e.target.classList.contains('save-row')){
    const row = e.target.closest('tr');
    const product = products.find(item=>item.id===row.dataset.id);
    if(product){
      product.name = row.querySelector('.edit-name').value;
      product.category = row.querySelector('.edit-category').value;
      product.price = parseFloat(row.querySelector('.edit-price').value) || 0;
      product.stock = Math.max(0, parseInt(row.querySelector('.edit-stock').value) || 0);
      product.sold = Math.max(0, parseInt(row.querySelector('.edit-sold').value) || 0);
    }
    await saveProducts();
    renderAll();
    return;
  }
  if(e.target.classList.contains('del-btn')){
    const row = e.target.closest('tr');
    const id = row.dataset.id;
    products = products.filter(p=>p.id!==id);
    await saveProducts();
    renderAll();
  }
});

document.getElementById('settingShopName').addEventListener('input', (e)=>{
  settings.shopName = e.target.value || 'Vapor Shop';
  document.getElementById('shopTitle').textContent = settings.shopName;
  saveSettings();
});
document.getElementById('settingThreshold').addEventListener('input', (e)=>{
  settings.lowStockThreshold = Math.max(0, parseInt(e.target.value) || 0);
  saveSettings();
  renderAll();
});

window.addEventListener('pagehide', ()=>{
  saveProducts();
  saveSettings();
});

function renderDashboardOnly(){
  const bsList = document.getElementById('bestSellerList');
  const bs = bestSellers();
  bsList.className = bs.length ? 'mini-list' : 'mini-list empty';
  bsList.innerHTML = bs.length
    ? bs.map(p=>`<li><span class="n">${escapeHtml(p.name)}</span><span class="v">${p.sold} sold</span></li>`).join('')
    : 'No sales recorded yet';

  const lowList = document.getElementById('lowStockList');
  const low = [...lowStock(), ...outOfStock()];
  lowList.className = low.length ? 'mini-list' : 'mini-list empty';
  lowList.innerHTML = low.length
    ? low.map(p=>`<li><span class="n">${escapeHtml(p.name)}</span><span class="v">${p.stock===0?'0 (out)':p.stock+' left'}</span></li>`).join('')
    : 'Everything is well stocked';

  document.getElementById('totalFlavors').textContent = products.length;
  document.getElementById('totalUnits').textContent = products.reduce((s,p)=>s+Number(p.stock||0),0);
}

loadData();
</script>
</body>
</html>
